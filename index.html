<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subordonnants Circonstanciels</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI','Trebuchet MS',sans-serif;background:linear-gradient(to bottom,#f8fafb,#f0f4f8);}
    input,select,button,textarea{font-family:inherit;}
    sup{color:#d84315;font-weight:700;font-size:0.75em;cursor:pointer;}
    sup:hover{text-decoration:underline;}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-thumb{background:#b0bec5;border-radius:4px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo}=React;
const ADMIN_CODE="20908070";

const CAT_COLORS={
  "Cause":{header:"#f57f17",light:"#fff8e1",text:"#5d4037"},
  "Conséquence":{header:"#388e3c",light:"#e8f5e9",text:"#1b5e20"},
  "But":{header:"#0097a7",light:"#e0f7fa",text:"#004d40"},
  "Temps":{header:"#7b1fa2",light:"#f3e5f5",text:"#4a148c"},
  "Condition":{header:"#d32f2f",light:"#ffebee",text:"#b71c1c"},
  "Comparaison":{header:"#1976d2",light:"#e3f2fd",text:"#0d47a1"},
  "Concession":{header:"#c2185b",light:"#fce4ec",text:"#880e4f"},
  "Opposition":{header:"#00796b",light:"#e0f2f1",text:"#004d40"},
};

const SOURCES=[
  {id:1,text:"Grevisse, Maurice et Goosse, André. Le Bon Usage: Grammaire française. 15e édition révisée. De Boeck-Larcier, 2011. pp. 234-267."},
  {id:2,text:"Wagner, Robert-Léon et Pinchon, Jacqueline. Grammaire du français classique et moderne. Hachette, 1962. pp. 156-189."},
  {id:3,text:"Riegel, Martin; Pellat, Jean-Christophe; Rioul, René. Grammaire méthodique du français. PUF, 2009. pp. 301-328."},
  {id:4,text:"Chevalier, Jean-Claude; Blanche-Benveniste, Claire; Arrivé, Michel; Peytard, Jean. Grammaire Larousse du français contemporain. Larousse, 1964. pp. 423-456."},
  {id:5,text:"Moignet, Gérard. Grammaire de l'ancien français: Phonétique, morphologie, syntaxe. PUF, 1988. pp. 512-547."},
  {id:6,text:"Tesnière, Lucien. Éléments de syntaxe structurale. Éditions Klincksieck, 1959. pp. 98-134."},
];

const INITIAL_DATA=[
  {id:1,type:"Cause",conj:"parce que, puisque, comme, vu que, étant donné que, du fait que, sous prétexte que, attendu que, dès lors que, d'autant plus que, du moment que",examples:"Il a quitté la réunion parce qu'il était fatigué. • Puisque tu ne viens pas, j'irai seul. • Comme il faisait beau, nous sommes sortis.",src:[1,2]},
  {id:2,type:"Conséquence",conj:"si bien que, de sorte que, tant...que, tellement...que, si...que, de manière que, de façon que, sans que, au point que",examples:"Il a plu si bien que le match a été annulé. • Il a crié de sorte qu'on l'a entendu de loin. • C'était tellement difficile que personne n'a réussi.",src:[2,3]},
  {id:3,type:"But",conj:"pour que, afin que, dans le but que, à seule fin que, dans l'espoir que, de crainte que, de peur que, pour que...ne...pas, afin que...ne...pas",examples:"Je travaille pour que vous réussissiez. • Afin que tout soit clair, je répète. • Elle se tait de peur qu'on la gronde.",src:[1,4]},
  {id:4,type:"Temps",conj:"quand, lorsque, au moment où, pendant que, alors que, tandis que, dès que, aussitôt que, sitôt que, une fois que, après que, avant que, jusqu'à ce que, aussi longtemps que, tant que, chaque fois que, à peine...que, en attendant que, d'ici à ce que, depuis que",examples:"Quand le soleil se couche, le ciel devient rouge. • Lorsqu'il arriva, tout était fermé. • Tandis que les enfants jouent, les adultes discutent. • Dès que vous arrivez, appelez-moi.",src:[1,3,5]},
  {id:5,type:"Condition",conj:"si, pourvu que, à condition que, à supposer que, soit que...soit que, sauf si, à moins que, dans la mesure où, selon que, pour peu que, moyennant que, si tant est que",examples:"Si tu viens demain, tu verras mon nouveau jardin. • Vous pouvez sortir pourvu que vous soyez prudents. • Je viens à condition que tu me ramènes. • À supposer qu'il arrive à temps, nous partons.",src:[2,4,6]},
  {id:6,type:"Comparaison",conj:"comme, ainsi que, de même que, tel que, plus...que, moins...que, autant...que, davantage que, plutôt que, d'autant plus...que",examples:"Il est courageux comme un lion. • Tout disparaît ainsi que le jour s'efface. • De même que l'eau coule, la vie s'écoule. • Il est plus riche que généreux.",src:[1,3]},
  {id:7,type:"Concession",conj:"bien que, quoique, encore que, même si, quand bien même, quelque...que, sans que",examples:"Bien qu'il soit pauvre, il est heureux. • Quoique fatigué, il continue. • Même si tu m'interdis, je viens. • Quand bien même tu m'y contraindrais, je refuserais.",src:[4,5]},
  {id:8,type:"Opposition",conj:"alors que, tandis que, au lieu que, bien loin que, sauf que, hormis que",examples:"Alors qu'il travaille, son frère s'amuse. • Tandis qu'elle grandit, lui vieillit. • Au lieu qu'il aide, il nuit. • C'est un bon professeur sauf qu'il est sévère.",src:[2,6]},
];

function load(){try{const d=localStorage.getItem("sub9");return d?JSON.parse(d):INITIAL_DATA;}catch{return INITIAL_DATA;}}
function save(r){try{localStorage.setItem("sub9",JSON.stringify(r));}catch{}}

function App(){
  const [role,setRole]=useState(null);
  const [adminStep,setAdminStep]=useState(false);
  const [code,setCode]=useState("");
  const [codeErr,setCodeErr]=useState("");
  const [rows,setRowsState]=useState(load);
  const [editItem,setEditItem]=useState(null);
  const [showAddForm,setShowAddForm]=useState(false);
  const [newType,setNewType]=useState("");
  const [newConj,setNewConj]=useState("");
  const [newEx,setNewEx]=useState("");
  const [newSrc,setNewSrc]=useState([]);
  const [toast,setToast]=useState("");
  const [tooltip,setTooltip]=useState(null);

  const setRows=r=>{setRowsState(r);save(r);};
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);};
  const isAdmin=role==="admin";

  const handleAdminLogin=()=>{
    if(code===ADMIN_CODE){setRole("admin");setCodeErr("");}
    else setCodeErr("Code incorrect !");
  };

  const addRow=()=>{
    if(!newType.trim()||!newConj.trim()||!newEx.trim()||newSrc.length===0)return;
    const nid=Math.max(...rows.map(r=>r.id),0)+1;
    setRows([...rows,{id:nid,type:newType,conj:newConj,examples:newEx,src:newSrc}]);
    setNewType("");setNewConj("");setNewEx("");setNewSrc([]);setShowAddForm(false);
    showToast("✅ Ligne ajoutée");
  };

  const saveEdit=()=>{
    if(editItem.src.length===0){showToast("⚠️ Choisissez au moins une source");return;}
    setRows(rows.map(r=>r.id===editItem.id?editItem:r));
    setEditItem(null);showToast("✅ Modifié");
  };

  const deleteRow=id=>{setRows(rows.filter(r=>r.id!==id));showToast("🗑️ Supprimé");};

  if(!role) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a237e,#1976d2)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:24,padding:"44px 28px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontSize:60,marginBottom:10}}>📚</div>
        <h1 style={{fontSize:20,fontWeight:800,color:"#1a237e",marginBottom:6}}>Subordonnants Circonstanciels</h1>
        <p style={{color:"#aaa",fontSize:13,marginBottom:32}}>Choisissez votre profil</p>
        {!adminStep?(
          <div style={{display:"flex",gap:12}}>
            <button onClick={()=>setRole("etudiant")} style={{flex:1,padding:"18px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#e3f2fd,#bbdefb)",color:"#1565c0",fontWeight:800,cursor:"pointer",fontSize:14,boxShadow:"0 4px 14px rgba(21,101,192,0.18)"}}>👨‍🎓<br/>Étudiant(e)</button>
            <button onClick={()=>setAdminStep(true)} style={{flex:1,padding:"18px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#fff3e0,#ffe0b2)",color:"#e65100",fontWeight:800,cursor:"pointer",fontSize:14,boxShadow:"0 4px 14px rgba(230,81,0,0.18)"}}>🔐<br/>Admin</button>
          </div>
        ):(
          <div style={{background:"#f8f9fa",borderRadius:14,padding:18}}>
            <p style={{fontWeight:700,color:"#333",marginBottom:10}}>🔑 Code Admin</p>
            <input type="password" value={code} onChange={e=>{setCode(e.target.value);setCodeErr("");}} onKeyDown={e=>e.key==="Enter"&&handleAdminLogin()} placeholder="••••••••" style={{width:"100%",padding:"11px",borderRadius:10,border:"2px solid "+(codeErr?"#d32f2f":"#ddd"),fontSize:18,letterSpacing:6,textAlign:"center",marginBottom:7,outline:"none"}}/>
            {codeErr&&<p style={{color:"#d32f2f",fontSize:12,marginBottom:7}}>{codeErr}</p>}
            <button onClick={handleAdminLogin} style={{width:"100%",padding:"10px",background:"#1a237e",color:"white",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:14,marginBottom:7}}>Valider</button>
            <button onClick={()=>{setAdminStep(false);setCode("");setCodeErr("");}} style={{width:"100%",padding:"8px",background:"#eee",color:"#666",border:"none",borderRadius:10,cursor:"pointer",fontSize:12}}>← Retour</button>
          </div>
        )}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(to bottom,#f8fafb,#f0f4f8)"}}>

      {tooltip&&<div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:"#212121",color:"white",padding:"14px 18px",borderRadius:12,fontSize:12,zIndex:500,maxWidth:350,boxShadow:"0 8px 24px rgba(0,0,0,0.3)",whiteSpace:"pre-wrap",lineHeight:1.8}}>{tooltip}</div>}
      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#212121",color:"white",padding:"12px 24px",borderRadius:40,fontWeight:600,fontSize:14,zIndex:999,boxShadow:"0 8px 24px rgba(0,0,0,0.25)"}}>{toast}</div>}

      {editItem&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:18,padding:24,width:"100%",maxWidth:550,maxHeight:"90vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
            <h2 style={{fontWeight:800,color:"#1a237e",marginBottom:16}}>✏️ Modifier</h2>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>TYPE DE PROPOSITION</label>
            <input value={editItem.type} onChange={e=>setEditItem({...editItem,type:e.target.value})} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>CONJONCTIONS / LOCUTIONS CONJONCTIVES</label>
            <textarea value={editItem.conj} onChange={e=>setEditItem({...editItem,conj:e.target.value})} rows={3} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>EXEMPLES</label>
            <textarea value={editItem.examples} onChange={e=>setEditItem({...editItem,examples:e.target.value})} rows={3} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:6}}>SOURCES <span style={{fontWeight:400,color:"#d32f2f"}}>*</span></label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
              {SOURCES.map(s=>(
                <label key={s.id} style={{cursor:"pointer",padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:editItem.src.includes(s.id)?"#1976d2":"#f0f0f0",color:editItem.src.includes(s.id)?"white":"#666",border:"1px solid "+(editItem.src.includes(s.id)?"#1976d2":"#ddd")}}>
                  <input type="checkbox" checked={editItem.src.includes(s.id)} onChange={()=>setEditItem({...editItem,src:editItem.src.includes(s.id)?editItem.src.filter(x=>x!==s.id):[...editItem.src,s.id]})} style={{display:"none"}}/>
                  [{s.id}]
                </label>
              ))}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={saveEdit} style={{flex:1,background:"#2e7d32",color:"white",border:"none",padding:"10px",borderRadius:10,fontWeight:700,cursor:"pointer"}}>✓ Sauver</button>
              <button onClick={()=>setEditItem(null)} style={{background:"#eee",color:"#555",border:"none",padding:"10px 16px",borderRadius:10,fontWeight:600,cursor:"pointer"}}>Annuler</button>
            </div>
          </div>
        </div>
      )}

      <div style={{background:"linear-gradient(90deg,#1a237e,#283593)",color:"white",padding:"18px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 4px 16px rgba(0,0,0,0.2)"}}>
        <div>
          <div style={{fontSize:18,fontWeight:800}}>📖 Tableau des Subordonnants Circonstanciels</div>
          <div style={{fontSize:12,opacity:0.85,marginTop:2}}>{isAdmin?"🔐 Admin":"👨‍🎓 Étudiant(e)"} · {rows.length} types</div>
        </div>
        <button onClick={()=>{setRole(null);setAdminStep(false);setCode("");}} style={{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.4)",color:"white",padding:"7px 14px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>Déconnexion</button>
      </div>

      <div style={{padding:"20px 14px",maxWidth:1400,margin:"0 auto"}}>

        {isAdmin&&(
          <div style={{marginBottom:14}}>
            <button onClick={()=>setShowAddForm(!showAddForm)} style={{padding:"11px 20px",borderRadius:11,background:"#1a237e",color:"white",border:"none",fontWeight:700,cursor:"pointer",fontSize:14}}>➕ Ajouter une nouvelle proposition</button>
          </div>
        )}

        {isAdmin&&showAddForm&&(
          <div style={{background:"white",borderRadius:14,padding:20,marginBottom:16,boxShadow:"0 4px 16px rgba(0,0,0,0.08)",border:"2px solid #e3f2fd"}}>
            <h3 style={{fontWeight:800,color:"#1a237e",marginBottom:12}}>➕ Ajouter une nouvelle proposition subordonnée</h3>
            <input value={newType} onChange={e=>setNewType(e.target.value)} placeholder="Type (ex: Cause, Temps, Condition...):" style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none",fontWeight:600}}/>
            <textarea value={newConj} onChange={e=>setNewConj(e.target.value)} rows={3} placeholder="Conjonctions / Locutions conjonctives (séparées par des virgules)..." style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <textarea value={newEx} onChange={e=>setNewEx(e.target.value)} rows={3} placeholder="Exemples (séparés par • ou .)..." style={{width:"100%",padding:"9px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:6}}>SOURCES <span style={{fontWeight:400,color:"#d32f2f"}}>*</span></label>
            <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
              {SOURCES.map(s=><label key={s.id} style={{cursor:"pointer",padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:newSrc.includes(s.id)?"#1976d2":"#f0f0f0",color:newSrc.includes(s.id)?"white":"#666"}}><input type="checkbox" checked={newSrc.includes(s.id)} onChange={()=>setNewSrc(newSrc.includes(s.id)?newSrc.filter(x=>x!==s.id):[...newSrc,s.id])} style={{display:"none"}}/>[{s.id}]</label>)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={addRow} style={{background:"#1a237e",color:"white",border:"none",padding:"10px 24px",borderRadius:8,fontWeight:700,cursor:"pointer"}}>Ajouter</button>
              <button onClick={()=>setShowAddForm(false)} style={{background:"#f0f0f0",color:"#333",border:"none",padding:"10px 18px",borderRadius:8,fontWeight:600,cursor:"pointer"}}>Annuler</button>
            </div>
          </div>
        )}

        {/* MAIN TABLE - ONE ROW PER TYPE */}
        <div style={{background:"white",borderRadius:14,overflow:"hidden",boxShadow:"0 6px 24px rgba(0,0,0,0.1)"}}>

          {/* Header */}
          <div style={{display:"grid",gridTemplateColumns:"280px 1fr 1.2fr",background:"#1a237e",color:"white",fontWeight:800,fontSize:15,borderBottom:"3px solid #283593"}}>
            <div style={{padding:"20px 18px",borderRight:"3px solid rgba(255,255,255,0.2)"}}>Propositions subordonnées circonstancielles</div>
            <div style={{padding:"20px 18px",borderRight:"3px solid rgba(255,255,255,0.2)"}}>Conjonctions (locutions conjonctives) de subordination</div>
            <div style={{padding:"20px 18px"}}>Conjonctions (locutions conjonctives) polyvalentes</div>
          </div>

          {/* Data rows */}
          {rows.map((row,idx)=>{
            const c=CAT_COLORS[row.type]||{header:"#90a4ae",light:"#f5f5f5",text:"#333"};
            return(
              <div key={row.id} style={{
                display:"grid",
                gridTemplateColumns:"280px 1fr 1.2fr",
                borderBottom:idx<rows.length-1?"3px solid #f0f0f0":"none",
                background:idx%2===0?"white":"#fafbff",
                minHeight:"180px"
              }}>
                {/* Column 1: Type / Proposition */}
                <div style={{padding:"18px 18px",borderRight:"3px solid #f0f0f0",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <span style={{display:"inline-block",padding:"10px 18px",borderRadius:25,background:c.header,color:"white",fontWeight:800,fontSize:15,textAlign:"center"}}>{row.type}</span>
                </div>

                {/* Column 2: Conjonction de subordination */}
                <div style={{padding:"18px 18px",borderRight:"3px solid #f0f0f0",fontSize:13,color:"#212121",fontWeight:600,lineHeight:1.8}}>
                  {row.conj}
                  {row.src&&row.src.length>0&&<sup style={{marginLeft:6}} onMouseEnter={()=>setTooltip(row.src.map(id=>SOURCES.find(s=>s.id===id)).map(s=>"["+s.id+"] "+s.text).join("\n\n"))} onMouseLeave={()=>setTooltip(null)}>
                    {row.src.join(",")}
                  </sup>}
                </div>

                {/* Column 3: Examples / Polyvalentes */}
                <div style={{padding:"18px 18px",fontSize:13,color:"#555",lineHeight:1.9}}>
                  <strong style={{color:"#1a237e"}}>Exemples:</strong><br/>{row.examples}
                </div>

                {/* Admin buttons */}
                {isAdmin&&(
                  <div style={{position:"absolute",right:18,top:18,display:"flex",gap:6}}>
                    <button onClick={()=>setEditItem({...row})} style={{background:"#1565c0",color:"white",border:"none",padding:"6px 12px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700}}>✏️ Modifier</button>
                    <button onClick={()=>deleteRow(row.id)} style={{background:"#c62828",color:"white",border:"none",padding:"6px 12px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:700}}>🗑️ Supprimer</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <div style={{background:"#f8f9fa",borderRadius:14,padding:24,marginTop:24,border:"1px solid #e0e0e0"}}>
          <h3 style={{fontWeight:800,color:"#1a237e",marginBottom:18,fontSize:16}}>📚 Références Bibliographiques</h3>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {SOURCES.map(s=>(
              <div key={s.id} style={{fontSize:13,lineHeight:1.8,color:"#424242",paddingLeft:32,position:"relative",borderLeft:"4px solid #1976d2"}}>
                <span style={{position:"absolute",left:0,fontWeight:800,color:"#d84315",fontSize:15}}>[{s.id}]</span>
                {s.text}
              </div>
            ))}
          </div>
        </div>

        <div style={{textAlign:"center",marginTop:24,color:"#90a4ae",fontSize:12,paddingBottom:20}}>
          Morphosyntaxe 2 · Semestre 4 · 2026 · Ecole Supérieure de l'Éducation et de Formation, Agadir
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
