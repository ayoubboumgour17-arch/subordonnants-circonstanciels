  {id:48,type:"Temps",conj:"d'ici à ce que",ex:"Restez tranquille d'ici à ce qu'on vous appelle.",src:[3]},
  {id:49,type:"Temps",conj:"depuis que",ex:"Depuis qu'il est parti, je ne l'ai pas revu.",src:[5]},

  {id:50,type:"Condition",conj:"si",ex:"Si tu viens demain, tu verras mon nouveau jardin.",src:[1]},
  {id:51,type:"Condition",conj:"pourvu que",ex:"Vous pouvez sortir pourvu que vous soyez prudents.",src:[2]},
  {id:52,type:"Condition",conj:"à condition que",ex:"Je viens à condition que tu me ramènes.",src:[4]},
  {id:53,type:"Condition",conj:"à supposer que",ex:"À supposer qu'il arrive à temps, nous partons.",src:[3]},
  {id:54,type:"Condition",conj:"soit que...soit que",ex:"Soit qu'il pleuve, soit qu'il neige, nous partons.",src:[6]},
  {id:55,type:"Condition",conj:"sauf si",ex:"Je viens sauf si je suis malade.",src:[5]},
  {id:56,type:"Condition",conj:"à moins que",ex:"Je viens à moins que tu ne me l'interdises.",src:[1]},
  {id:57,type:"Condition",conj:"dans la mesure où",ex:"Je t'aiderai dans la mesure où je peux.",src:[2]},

  {id:61,type:"Condition",conj:"si tant est que",ex:"Si tant est que j'aie le temps, je viendrai.",src:[6]},

  {id:62,type:"Comparaison",conj:"comme",ex:"Il est courageux comme un lion.",src:[1]},
  {id:63,type:"Comparaison",conj:"ainsi que",ex:"Tout disparaît ainsi que le jour s'efface.",src:[2]},
  {id:64,type:"Comparaison",conj:"de même que",ex:"De même que l'eau coule, la vie s'écoule.",src:[4]},
  {id:65,type:"Comparaison",conj:"tel que",ex:"Il agit tel que je l'avais prévu.",src:[3]},
  {id:66,type:"Comparaison",conj:"plus...que",ex:"Il est plus riche que généreux.",src:[5]},
  {id:67,type:"Comparaison",conj:"moins...que",ex:"Elle est moins douée que son frère.",src:[1]},

  {id:72,type:"Concession",conj:"bien que",ex:"Bien qu'il soit pauvre, il est heureux.",src:[5]},

  {id:77,type:"Concession",conj:"quelque...que",ex:"Quelque riche qu'il soit, il n'est pas heureux.",src:[3]},

  {id:79,type:"Opposition",conj:"alors que",ex:"Alors qu'il travaille, son frère s'amuse.",src:[1]},
  {id:80,type:"Opposition",conj:"tandis que",ex:"Tandis qu'elle grandit, lui vieillit.",src:[2]},
  {id:81,type:"Opposition",conj:"au lieu que",ex:"Au lieu qu'il aide, il nuit.",src:[4]},
  {id:82,type:"Opposition",conj:"bien loin que",ex:"Bien loin qu'il m'aide, il m'embarrasse.",src:[6]},
  {id:83,type:"Opposition",conj:"sauf que",ex:"C'est un bon professeur sauf qu'il est sévère.",src:[3]},
  {id:84,type:"Opposition",conj:"hormis que",ex:"C'est parfait hormis que c'est cher.",src:[5]},

function load(){try{const d=localStorage.getItem("sub7");return d?JSON.parse(d):INITIAL_DATA;}catch{return INITIAL_DATA;}}
function save(r){try{localStorage.setItem("sub7",JSON.stringify(r));}catch{}}

function App(){
  const [role,setRole]=useState(null);
  const [adminStep,setAdminStep]=useState(false);
  const [code,setCode]=useState("");
  const [codeErr,setCodeErr]=useState("");
  const [rows,setRowsState]=useState(load);
  const [search,setSearch]=useState("");
  const [filterType,setFilterType]=useState("");
  const [editItem,setEditItem]=useState(null);
  const [showAddForm,setShowAddForm]=useState(false);
  const [newType,setNewType]=useState("");
  const [newConj,setNewConj]=useState("");
  const [newEx,setNewEx]=useState("");
  const [newSrc,setNewSrc]=useState([]);
  const [toast,setToast]=useState("");
  const [tooltip,setTooltip]=useState(null);

  const setRows=r=>{setRowsState(r);save(r);};
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);};
  const isAdmin=role==="admin";
  const types=[...new Set(rows.map(r=>r.type))].sort();

  const handleAdminLogin=()=>{
    if(code===ADMIN_CODE){setRole("admin");setCodeErr("");}
    else setCodeErr("Code incorrect !");
  };

  const filtered=useMemo(()=>{
    return rows.filter(r=>{
      const sq=search.toLowerCase();
      const mt=(filterType===""||r.type===filterType);
      const ms=r.conj.toLowerCase().includes(sq)||r.type.toLowerCase().includes(sq)||r.ex.toLowerCase().includes(sq);
      return mt&&ms;
    });
  },[rows,search,filterType]);

  const addRow=()=>{
    if(!newType.trim()||!newConj.trim()||!newEx.trim()||newSrc.length===0)return;
    const nid=Math.max(...rows.map(r=>r.id),0)+1;
    setRows([...rows,{id:nid,type:newType,conj:newConj,ex:newEx,src:newSrc}]);
    setNewType("");setNewConj("");setNewEx("");setNewSrc([]);setShowAddForm(false);
    showToast("✅ Ligne ajoutée");
  };

  const saveEdit=()=>{
    if(editItem.src.length===0){showToast("⚠️ Choisissez au moins une source");return;}
    setRows(rows.map(r=>r.id===editItem.id?editItem:r));
    setEditItem(null);showToast("✅ Modifié");
  };

  const deleteRow=id=>{setRows(rows.filter(r=>r.id!==id));showToast("🗑️ Supprimé");};

  if(!role) return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1a237e,#1976d2)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"white",borderRadius:24,padding:"44px 28px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.3)",textAlign:"center"}}>
        <div style={{fontSize:60,marginBottom:10}}>📚</div>
        <h1 style={{fontSize:20,fontWeight:800,color:"#1a237e",marginBottom:6}}>Subordonnants Circonstanciels</h1>
        <p style={{color:"#aaa",fontSize:13,marginBottom:32}}>Choisissez votre profil</p>
        {!adminStep?(
          <div style={{display:"flex",gap:12}}>
            <button onClick={()=>setRole("etudiant")} style={{flex:1,padding:"18px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#e3f2fd,#bbdefb)",color:"#1565c0",fontWeight:800,cursor:"pointer",fontSize:14,boxShadow:"0 4px 14px rgba(21,101,192,0.18)"}}>👨‍🎓<br/>Étudiant(e)</button>
            <button onClick={()=>setAdminStep(true)} style={{flex:1,padding:"18px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#fff3e0,#ffe0b2)",color:"#e65100",fontWeight:800,cursor:"pointer",fontSize:14,boxShadow:"0 4px 14px rgba(230,81,0,0.18)"}}>🔐<br/>Admin</button>
          </div>
        ):(
          <div style={{background:"#f8f9fa",borderRadius:14,padding:18}}>
            <p style={{fontWeight:700,color:"#333",marginBottom:10}}>🔑 Code Admin</p>
            <input type="password" value={code} onChange={e=>{setCode(e.target.value);setCodeErr("");}} onKeyDown={e=>e.key==="Enter"&&handleAdminLogin()} placeholder="••••••••" style={{width:"100%",padding:"11px",borderRadius:10,border:"2px solid "+(codeErr?"#d32f2f":"#ddd"),fontSize:18,letterSpacing:6,textAlign:"center",marginBottom:7,outline:"none"}}/>
            {codeErr&&<p style={{color:"#d32f2f",fontSize:12,marginBottom:7}}>{codeErr}</p>}
            <button onClick={handleAdminLogin} style={{width:"100%",padding:"10px",background:"#1a237e",color:"white",border:"none",borderRadius:10,fontWeight:700,cursor:"pointer",fontSize:14,marginBottom:7}}>Valider</button>
            <button onClick={()=>{setAdminStep(false);setCode("");setCodeErr("");}} style={{width:"100%",padding:"8px",background:"#eee",color:"#666",border:"none",borderRadius:10,cursor:"pointer",fontSize:12}}>← Retour</button>
          </div>
        )}
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(to bottom,#f8fafb,#f0f4f8)"}}>

      {tooltip&&<div style={{position:"fixed",bottom:100,left:"50%",transform:"translateX(-50%)",background:"#212121",color:"white",padding:"14px 18px",borderRadius:12,fontSize:12,zIndex:500,maxWidth:320,boxShadow:"0 8px 24px rgba(0,0,0,0.3)",whiteSpace:"pre-wrap",lineHeight:1.8}}>{tooltip}</div>}
      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#212121",color:"white",padding:"12px 24px",borderRadius:40,fontWeight:600,fontSize:14,zIndex:999,boxShadow:"0 8px 24px rgba(0,0,0,0.25)"}}>{toast}</div>}

      {editItem&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"white",borderRadius:18,padding:24,width:"100%",maxWidth:500,maxHeight:"90vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
            <h2 style={{fontWeight:800,color:"#1a237e",marginBottom:16}}>✏️ Modifier</h2>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>TYPE</label>
            <select value={editItem.type} onChange={e=>setEditItem({...editItem,type:e.target.value})} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none"}}>
              {types.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>CONJONCTION</label>
            <input value={editItem.conj} onChange={e=>setEditItem({...editItem,conj:e.target.value})} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:3}}>EXEMPLE</label>
            <textarea value={editItem.ex} onChange={e=>setEditItem({...editItem,ex:e.target.value})} rows={2} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #90caf9",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:6}}>SOURCES <span style={{fontWeight:400,color:"#d32f2f"}}>*</span></label>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
              {SOURCES.map(s=>(
                <label key={s.id} style={{cursor:"pointer",padding:"5px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:editItem.src.includes(s.id)?"#1976d2":"#f0f0f0",color:editItem.src.includes(s.id)?"white":"#666",border:"1px solid "+(editItem.src.includes(s.id)?"#1976d2":"#ddd")}}>
                  <input type="checkbox" checked={editItem.src.includes(s.id)} onChange={()=>setEditItem({...editItem,src:editItem.src.includes(s.id)?editItem.src.filter(x=>x!==s.id):[...editItem.src,s.id]})} style={{display:"none"}}/>
                  [{s.id}]
                </label>
              ))}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={saveEdit} style={{flex:1,background:"#2e7d32",color:"white",border:"none",padding:"10px",borderRadius:10,fontWeight:700,cursor:"pointer"}}>✓ Sauver</button>
              <button onClick={()=>setEditItem(null)} style={{background:"#eee",color:"#555",border:"none",padding:"10px 16px",borderRadius:10,fontWeight:600,cursor:"pointer"}}>Annuler</button>
            </div>
          </div>
        </div>
      )}

      <div style={{background:"linear-gradient(90deg,#1a237e,#283593)",color:"white",padding:"18px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 4px 16px rgba(0,0,0,0.2)"}}>
        <div>
          <div style={{fontSize:18,fontWeight:800}}>📖 Tableau des Subordonnants Circonstanciels</div>
          <div style={{fontSize:12,opacity:0.85,marginTop:2}}>{isAdmin?"🔐 Admin":"👨‍🎓 Étudiant(e)"} · {rows.length} subordonnants</div>
        </div>
        <button onClick={()=>{setRole(null);setAdminStep(false);setCode("");}} style={{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.4)",color:"white",padding:"7px 14px",borderRadius:8,cursor:"pointer",fontWeight:600,fontSize:13}}>Déconnexion</button>
      </div>

      <div style={{padding:"20px 14px",maxWidth:1000,margin:"0 auto"}}>

        <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Rechercher une conjonction…" style={{flex:"1 1 200px",padding:"10px 14px",borderRadius:11,border:"2px solid #e0e0e0",fontSize:14,background:"white",outline:"none"}}/>
          <select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{padding:"10px 12px",borderRadius:11,border:"2px solid #e0e0e0",fontSize:14,background:"white",cursor:"pointer"}}>
            <option value="">Tous les types</option>
            {types.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          {isAdmin&&<button onClick={()=>setShowAddForm(!showAddForm)} style={{padding:"10px 18px",borderRadius:11,background:"#1a237e",color:"white",border:"none",fontWeight:700,cursor:"pointer",fontSize:14}}>➕</button>}
        </div>

        {isAdmin&&showAddForm&&(
          <div style={{background:"white",borderRadius:14,padding:18,marginBottom:16,boxShadow:"0 4px 16px rgba(0,0,0,0.08)",border:"2px solid #e3f2fd"}}>
            <h3 style={{fontWeight:800,color:"#1a237e",marginBottom:12}}>➕ Ajouter une ligne</h3>
            <select value={newType} onChange={e=>setNewType(e.target.value)} style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none"}}>
              <option value="">Choisir un type...</option>
              {types.map(t=><option key={t} value={t}>{t}</option>)}
            </select>
            <input value={newConj} onChange={e=>setNewConj(e.target.value)} placeholder="Conjonction..." style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none"}}/>
            <textarea value={newEx} onChange={e=>setNewEx(e.target.value)} rows={2} placeholder="Exemple..." style={{width:"100%",padding:"8px 12px",borderRadius:8,border:"2px solid #e0e0e0",fontSize:13,marginBottom:10,outline:"none",resize:"vertical"}}/>
            <label style={{fontSize:12,fontWeight:700,color:"#666",display:"block",marginBottom:6}}>SOURCES <span style={{fontWeight:400,color:"#d32f2f"}}>*</span></label>
            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              {SOURCES.map(s=><label key={s.id} style={{cursor:"pointer",padding:"4px 8px",borderRadius:20,fontSize:11,fontWeight:700,background:newSrc.includes(s.id)?"#1976d2":"#f0f0f0",color:newSrc.includes(s.id)?"white":"#666"}}><input type="checkbox" checked={newSrc.includes(s.id)} onChange={()=>setNewSrc(newSrc.includes(s.id)?newSrc.filter(x=>x!==s.id):[...newSrc,s.id])} style={{display:"none"}}/>[{s.id}]</label>)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={addRow} style={{background:"#1a237e",color:"white",border:"none",padding:"9px 18px",borderRadius:8,fontWeight:700,cursor:"pointer"}}>Ajouter</button>
              <button onClick={()=>setShowAddForm(false)} style={{background:"#f0f0f0",color:"#333",border:"none",padding:"9px 14px",borderRadius:8,fontWeight:600,cursor:"pointer"}}>Annuler</button>
            </div>
          </div>
        )}

        <div style={{background:"white",borderRadius:14,overflow:"hidden",boxShadow:"0 4px 20px rgba(0,0,0,0.08)"}}>
          <div style={{display:"grid",gridTemplateColumns:isAdmin?"1fr 1.2fr 1.5fr 80px":"1fr 1.2fr 1.5fr",background:"#1a237e",color:"white",fontWeight:700,fontSize:13,gap:1}}>
            <div style={{padding:"14px 16px",borderRight:"1px solid rgba(255,255,255,0.1)"}}>Type</div>
            <div style={{padding:"14px 16px",borderRight:"1px solid rgba(255,255,255,0.1)"}}>Conjonctions</div>
            <div style={{padding:"14px 16px",borderRight:isAdmin?"1px solid rgba(255,255,255,0.1)":"none"}}>Exemples</div>
            {isAdmin&&<div style={{padding:"14px 8px",textAlign:"center"}}>Actions</div>}
          </div>

          {filtered.map((row,idx)=>{
            const c=CAT_COLORS[row.type]||{header:"#90a4ae",light:"#f5f5f5",text:"#333"};
            return(
              <div key={row.id} style={{display:"grid",gridTemplateColumns:isAdmin?"1fr 1.2fr 1.5fr 80px":"1fr 1.2fr 1.5fr",borderBottom:idx<filtered.length-1?"1px solid #f0f0f0":"none",background:idx%2===0?"white":"#fafbff",gap:1}}>
                <div style={{padding:"13px 16px",borderRight:"1px solid #f0f0f0"}}>
                  <span style={{display:"inline-block",padding:"5px 11px",borderRadius:20,background:c.header,color:"white",fontWeight:700,fontSize:12}}>{row.type}</span>
                </div>
                <div style={{padding:"13px 16px",borderRight:"1px solid #f0f0f0",fontSize:13,color:"#212121",fontWeight:600}}>
                  {row.conj}
                  {row.src&&row.src.length>0&&<sup style={{marginLeft:6}} onMouseEnter={()=>setTooltip(row.src.map(id=>SOURCES.find(s=>s.id===id)).map(s=>"["+s.id+"] "+s.text).join("\n\n"))} onMouseLeave={()=>setTooltip(null)}>
                    {row.src.join(",")}
                  </sup>}
                </div>
                <div style={{padding:"13px 16px",borderRight:isAdmin?"1px solid #f0f0f0":"none",fontSize:13,color:"#555",lineHeight:1.6}}>
                  <em>"{row.ex}"</em>
                </div>
                {isAdmin&&(
                  <div style={{padding:"10px 6px",display:"flex",flexDirection:"column",gap:4,alignItems:"center"}}>
                    <button onClick={()=>setEditItem({...row})} style={{background:"#1565c0",color:"white",border:"none",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700,width:56}}>Modifier</button>
                    <button onClick={()=>deleteRow(row.id)} style={{background:"#c62828",color:"white",border:"none",padding:"4px 8px",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700,width:56}}>Supprimer</button>
                  </div>
                )}
              </div>
            );
          })}

          {filtered.length===0&&(
            <div style={{textAlign:"center",padding:"50px",color:"#bbb",fontSize:15}}>😕 Aucun résultat</div>
          )}
        </div>

        <div style={{background:"#f8f9fa",borderRadius:14,padding:20,marginTop:20,border:"1px solid #e0e0e0"}}>
          <h3 style={{fontWeight:800,color:"#1a237e",marginBottom:16,fontSize:15}}>📚 Références Bibliographiques</h3>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {SOURCES.map(s=>(
              <div key={s.id} style={{fontSize:13,lineHeight:1.8,color:"#424242",paddingLeft:28,position:"relative",borderLeft:"3px solid #1976d2",paddingLeft:14}}>
                <span style={{position:"absolute",left:0,fontWeight:800,color:"#d84315",fontSize:14}}>[{s.id}]</span>
                {s.text}
              </div>
            ))}
          </div>
        </div>

        <div style={{textAlign:"center",marginTop:18,color:"#90a4ae",fontSize:11}}>
          Morphosyntaxe 2 · Semestre 4 · 2026 · Ecole Supérieure de l'Éducation et de Formation, Agadir
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
